<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Clientes</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="background">

        <div class="container">

            <div class="header">

                <h1>Registro de Clientes</h1>

                <p>
                    Complete la siguiente información.
                </p>

            </div>

            <form>

                <!-- ========================================= -->

                <section class="card">

                    <h2>Datos del Cliente</h2>

                    <div class="grid-2">

                        <div class="form-group">

                            <label>Nombres</label>

                            <input type="text" placeholder="Ingrese los nombres">

                        </div>

                        <div class="form-group">

                            <label>Apellidos</label>

                            <input type="text" placeholder="Ingrese los apellidos">

                        </div>

                    </div>

                    <!-- ========================================= -->

                    <div class="grid-2">

                        <div class="form-group">

                            <label>Tipo de identificación</label>

                            <div class="radio-group">

                                <label class="radio">
                                    <input type="radio" name="tipo">
                                    <span>Cédula</span>
                                </label>

                                <label class="radio">
                                    <input type="radio" name="tipo">
                                    <span>Pasaporte</span>
                                </label>

                            </div>

                        </div>

                        <div class="form-group">

                            <label>Número de identificación</label>

                            <input type="text" placeholder="000-0000000-0">

                        </div>

                    </div>

                    <!-- ========================================= -->

                    <div class="grid-2">

                        <div class="form-group">

                            <label>Teléfono de Casa</label>

                            <input type="text">

                        </div>

                        <div class="form-group">

                            <label>Celular</label>

                            <input type="text">

                        </div>

                    </div>

                    <!-- ========================================= -->

                    <div class="grid-2">

                        <div class="form-group">

                            <label>Calle - Edificio - Número</label>

                            <input type="text">

                        </div>

                        <div class="form-group">

                            <label>Interior</label>

                            <input type="text">

                        </div>

                    </div>

                    <!-- ========================================= -->

                    <div class="grid-2">

                        <div class="form-group">

                            <label>Lugar de Nacimiento</label>

                            <select>

                                <option>Seleccione...</option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label>Nacionalidad</label>

                            <select>

                                <option>Seleccione...</option>

                            </select>

                        </div>

                    </div>

                    <!-- ========================================= -->

                    <div class="grid-3">

                        <div class="form-group">

                            <label>Sector</label>

                            <select>

                                <option>Seleccione...</option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label>Ciudad</label>

                            <select>

                                <option>Seleccione...</option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label>País</label>

                            <select>

                                <option>Seleccione...</option>

                            </select>

                        </div>

                    </div>

                    <!-- ========================================= -->

                    <div class="grid-2">

                        <div class="form-group">

                            <label>Email Personal</label>

                            <input type="email">

                        </div>

                        <div class="form-group">

                            <label>
                                ¿Es sujeto obligado de la Ley 155-17 sobre Lavado de activos?
                            </label>

                            <div class="radio-group">

                                <label class="radio">

                                    <input type="radio" name="ley">

                                    <span>Sí</span>

                                </label>

                                <label class="radio">

                                    <input type="radio" name="ley">

                                    <span>No</span>

                                </label>

                            </div>

                        </div>

                    </div>

                    <!-- ========================================= -->

                    <div class="grid-3">

                        <div class="form-group">

                            <label>Estado Civil</label>

                            <select>

                                <option>Seleccione...</option>

                                <option>Soltero</option>

                                <option>Casado</option>

                                <option>Divorciado</option>

                                <option>Viudo</option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label>Sexo</label>

                            <div class="radio-group">

                                <label class="radio">

                                    <input type="radio" name="sexo">

                                    <span>Masculino</span>

                                </label>

                                <label class="radio">

                                    <input type="radio" name="sexo">

                                    <span>Femenino</span>

                                </label>

                            </div>

                        </div>

                        <div class="form-group">

                            <label>Profesión</label>

                            <input type="text">

                        </div>

                    </div>

                    <!-- ========================================= -->

                    <div class="form-group">

                        <label>Ocupación</label>

                        <div class="radio-group">

                            <label class="radio">

                                <input type="radio" name="ocupacion">

                                <span>Empleado</span>

                            </label>

                            <label class="radio">

                                <input type="radio" name="ocupacion">

                                <span>Independiente</span>

                            </label>

                            <label class="radio">

                                <input type="radio" name="ocupacion">

                                <span>Empresario</span>

                            </label>

                            <label class="radio">

                                <input type="radio" name="ocupacion">

                                <span>Otro</span>

                            </label>

                        </div>

                    </div>
                    <!-- ========================================================= -->

                    <div class="section-divider"></div>

                    <h2>Datos Laborales</h2>

                    <div class="grid-2">

                        <div class="form-group">

                            <label>Empresa</label>

                            <input type="text" placeholder="Nombre de la empresa">

                        </div>

                        <div class="form-group">

                            <label>Calle - Edificio - Número - Interior</label>

                            <input type="text" placeholder="Dirección de la empresa">

                        </div>

                    </div>

                    <!-- ========================================================= -->

                    <div class="grid-3">

                        <div class="form-group">

                            <label>Sector</label>

                            <select>

                                <option>Seleccione...</option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label>Ciudad</label>

                            <select>

                                <option>Seleccione...</option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label>País</label>

                            <select>

                                <option>Seleccione...</option>

                            </select>

                        </div>

                    </div>

                    <!-- ========================================================= -->

                    <div class="grid-3">

                        <div class="form-group">

                            <label>Cargo que ocupa</label>

                            <input type="text" placeholder="Ej. Gerente Comercial">

                        </div>

                        <div class="form-group">

                            <label>Fecha de ingreso</label>

                            <input type="date">

                        </div>

                        <div class="form-group">

                            <label>Teléfono del trabajo</label>

                            <input type="text" placeholder="(809) 555-5555">

                        </div>

                    </div>

                    <!-- ========================================================= -->

                    <div class="grid-2">

                        <div class="form-group">

                            <label>Email de la empresa</label>

                            <input type="email" placeholder="correo@empresa.com">

                        </div>

                        <div class="form-group">

                            <label>Comentarios</label>

                            <textarea rows="5" placeholder="Escriba cualquier información adicional..."></textarea>

                        </div>

                    </div>

                </section>

            </form>

        </div>

    </div>

</body>

</html>
