<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Clientes</title>
    <link rel="shortcut icon" href="/assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="welcome-page">
    <div class="welcome-container">
      <div class="welcome-card success-card">
        <img src="assets/LogoJMMB.png" class="logo" alt="Logo JMMB" />

        <h1>¡Listo!</h1>

        <h2>Tu solicitud fue registrada correctamente.</h2>

        <!-- ========================================= -->
        <!-- AVISO DE FIRMA -->
        <!-- ========================================= -->

        <div class="signature-notice">
          <div class="signature-image">
            <img src="assets/firma.png" alt="Firma del formulario" />
          </div>

          <div class="signature-content">
            <p class="signature-title">
              Para completar el proceso, aún debes firmar físicamente el
              formulario.
            </p>

            <p class="signature-text">
              Un asesor te lo entregará para que puedas revisarlo y firmarlo.
            </p>
          </div>
        </div>

        <!-- ========================================= -->
        <!-- QUÉ SIGUE -->
        <!-- ========================================= -->

        <div class="next-step">
          <div class="next-step-image">
            <img src="assets/asesor.png" alt="Asesor" />
          </div>

          <div class="next-step-divider"></div>

          <div class="next-step-content">
            <h3>¿Qué sigue?</h3>

            <p>Tu asesor te acompañará con los siguientes pasos.</p>
          </div>
        </div>
        <button class="btn-primary" id="btnVolverInicio">
          Volver al inicio
        </button>
      </div>
    </div>
    <script src="app/paises.js"></script>
    <script src="app/municipios.js"></script>
    <script src="app/app.js"></script>
  </body>
</html>
