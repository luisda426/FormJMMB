<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Registro de Clientes</title>

    <link rel="shortcut icon" href="/assets/favicon.png" type="image/png" />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body data-step="2">
    <div class="background">
      <div class="container">
        <div class="header">
          <h1>Registro de Clientes</h1>

          <p>Complete la siguiente información.</p>
        </div>
        <div class="progress-wrapper">
          <div class="progress-header">
            <span class="progress-step"> Paso 0 de 10 </span>

            <span class="progress-percent"> 0% </span>
          </div>

          <div class="progress-bar">
            <div class="progress-fill" style="width: 0%"></div>
          </div>
        </div>

        <form id="formRegistro" data-seccion="datosLaborales">
          <!-- ========================================= -->

          <section class="card">
            <h2>Datos Laborales</h2>

            <div class="grid-2">
              <div class="form-group">
                <label>Empresa</label>

                <input
                  type="text"
                  placeholder="Nombre de la empresa"
                  data-field="empresa"
                />
              </div>

              <div class="form-group">
                <label>Calle - Edificio - Número - Unidad</label>

                <input
                  type="text"
                  placeholder="Dirección de la empresa"
                  data-field="direccionEmpresa"
                />
              </div>
            </div>

            <!-- ========================================================= -->

            <div class="grid-3">
              <div class="form-group">
                <label>Ciudad</label>

                <select data-field="ciudad" data-municipios></select>
              </div>

              <div class="form-group">
                <label>Sector</label>

                <select data-field="sector">
                  <option>Seleccione...</option>
                  <option value="pruebasector">Prueba</option>
                </select>
              </div>

              <div class="form-group">
                <label>País</label>

                <select data-field="pais" data-paises>
                  <option value="">Seleccione...</option>
                </select>
              </div>
            </div>

            <!-- ========================================================= -->

            <div class="grid-3">
              <div class="form-group">
                <label>Cargo que ocupa</label>

                <input
                  type="text"
                  placeholder="Ej. Gerente Comercial"
                  data-field="cargo"
                />
              </div>

              <div class="form-group">
                <label>Fecha de ingreso</label>

                <input type="date" data-field="ingreso" />
              </div>

              <div class="form-group">
                <label>Teléfono del trabajo</label>

                <input
                  type="text"
                  class="telefonoMascara"
                  placeholder="(809) 555-5555"
                  data-field="telefono"
                />
              </div>
            </div>

            <!-- ========================================================= -->

            <div class="grid-2">
              <div class="form-group">
                <label>Email de la empresa</label>

                <input
                  type="email"
                  placeholder="correo@empresa.com"
                  data-field="email"
                />
              </div>

              <div class="form-group">
                <label>Comentarios</label>

                <textarea
                  rows="5"
                  placeholder="Escriba cualquier información adicional..."
                  data-field="comentarios"
                ></textarea>
              </div>
            </div>

            <!-- ========================================= -->

            <div class="button-group">
              <button type="button" class="btn-secondary" id="btnAnterior">
                ← Anterior
              </button>

              <button type="button" class="btn-primary" id="btnSiguiente">
                Siguiente →
              </button>
            </div>
          </section>
        </form>
      </div>
    </div>
    <!-- <div id="loadingOverlay">
      <img src="assets/loading.gif" />

      <p id="loadingText">Preparando formulario...</p>
    </div> -->
  </body>

  <script src="app/paises.js"></script>
  <script src="app/municipios.js"></script>
  <script src="app/sectores.js"></script>
  <script src="app/app.js"></script>
</html>
