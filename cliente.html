<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Registro de Clientes</title>
    <link rel="shortcut icon" href="/assets/favicon.png" type="image/png" />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body data-step="1">
    <div class="background">
      <div class="container">
        <div class="header">
          <h1>Registro de Clientes</h1>

          <p>Complete la siguiente información.</p>
        </div>
        <div class="progress-wrapper">
          <div class="progress-header">
            <span class="progress-step"> Paso 0 de 9 </span>

            <span class="progress-percent"> 0% </span>
          </div>

          <div class="progress-bar">
            <div class="progress-fill" style="width: 0%"></div>
          </div>
        </div>

        <form id="formRegistro" data-seccion="datosCliente">
          <!-- ========================================= -->

          <section class="card">
            <h2>Datos del Cliente</h2>

            <div class="grid-2">
              <div class="form-group">
                <label>Nombres</label>

                <input
                  id="nombres"
                  type="text"
                  placeholder="Ingrese los nombres"
                  data-field="nombres"
                />
              </div>

              <div class="form-group">
                <label>Apellidos</label>

                <input
                  id="apellidos"
                  type="text"
                  placeholder="Ingrese los apellidos"
                  data-field="apellidos"
                />
              </div>
            </div>

            <!-- ========================================= -->

            <div class="grid-3">
              <div class="form-group">
                <label>Tipo de identificación</label>

                <div class="radio-group">
                  <label class="radio">
                    <input
                      value="Cédula"
                      type="radio"
                      name="tipo"
                      data-field="tipoDocumento"
                      data-target="divResidenteRD divIdExtranjero"
                      data-show-value="Pasaporte"
                    />
                    <span>Cédula</span>
                  </label>

                  <label class="radio">
                    <input
                      value="Pasaporte"
                      type="radio"
                      name="tipo"
                      data-field="tipoDocumento"
                      data-target="divResidenteRD divIdExtranjero"
                      data-show-value="Pasaporte"
                    />
                    <span>Pasaporte</span>
                  </label>
                </div>
              </div>

              <div class="form-group">
                <label>Número de identificación</label>

                <input
                  id="identificacion"
                  type="text"
                  placeholder="000-0000000-0"
                  data-field="identificacion"
                  data-mask="identificacion"
                  disabled
                />
              </div>
              <div id="divIdExtranjero" class="form-group hidden">
                <label>ID país de Origen</label>

                <input
                  id="idExtranjero"
                  type="text"
                  placeholder="Ingrese el ID"
                  data-field="idExtranjero"
                />
              </div>
            </div>

            <!-- ========================================= -->

            <div class="grid-2">
              <div class="form-group">
                <label>Fecha de nacimiento</label>

                <input type="date" data-field="fechaNacimiento" />
              </div>
              <div class="form-group">
                <label>Email Personal</label>

                <input id="email" type="email" data-field="email" />
              </div>
            </div>

            <!-- ========================================= -->

            <div class="grid-3">
              <div class="form-group">
                <label>Teléfono de Casa</label>

                <input
                  id="telefonoCasa"
                  type="text"
                  class="telefonoMascara"
                  placeholder="809-000-0000"
                  data-field="telefonoCasa"
                />
              </div>
              <div class="form-group">
                <label>Celular</label>

                <input
                  id="celular"
                  type="text"
                  class="telefonoMascara"
                  placeholder="809-000-0000"
                  data-field="celular"
                />
              </div>
              <div class="form-group">
                <label>Otro telefono</label>

                <input
                  id="otroTelefono"
                  type="text"
                  class="telefonoMascara"
                  placeholder="809-000-0000"
                  data-field="otroTelefono"
                />
              </div>
            </div>

            <!-- ========================================= -->

            <div class="grid-2">
              <div class="form-group">
                <label>Lugar de Nacimiento</label>

                <select
                  id="nacimiento"
                  data-field="lugarNacimiento"
                  data-paises
                >
                  <option value="">Seleccione...</option>
                </select>
              </div>

              <div class="form-group">
                <label>Nacionalidad</label>

                <select
                  id="nacionalidad"
                  data-field="nacionalidad"
                  data-paises
                >
                  <option value="">Seleccione...</option>
                </select>
              </div>
            </div>

            <!-- ========================================= -->

            <div class="grid-1">
              <div class="form-group">
                <label>Calle - Edificio - Número - Unidad</label>

                <input id="direccion" type="text" data-field="direccion" />
              </div>
            </div>

            <!-- ========================================= -->

            <div class="grid-3">
              <div class="form-group">
                <label>Ciudad</label>

                <select
                  id="ciudad"
                  data-field="ciudad"
                  data-municipios
                ></select>
              </div>

              <div class="form-group">
                <label>Sector</label>

                <select id="sector" data-field="sector" data-sectores></select>
              </div>

              <div class="form-group">
                <label>País</label>

                <select id="pais" data-field="pais" data-paises></select>
              </div>
            </div>

            <!-- ========================================= -->

            <div class="grid-2"></div>

            <!-- ========================================= -->

            <div class="grid-3">
              <div class="form-group">
                <label>Estado Civil</label>

                <select
                  id="civil"
                  data-field="civil"
                  data-target="divDatosConyuge"
                  data-show-value="Casado"
                >
                  <option disabled selected>Seleccione...</option>
                  <option>Soltero</option>
                  <option>Casado</option>
                </select>
              </div>

              <div class="form-group">
                <label>Sexo</label>

                <div class="radio-group">
                  <label class="radio">
                    <input
                      type="radio"
                      name="sexo"
                      value="Masculino"
                      data-field="sexo"
                    />

                    <span>Masculino</span>
                  </label>

                  <label class="radio">
                    <input
                      type="radio"
                      name="sexo"
                      value="Femenino"
                      data-field="sexo"
                    />

                    <span>Femenino</span>
                  </label>
                </div>
              </div>
              <div id="divResidenteRD" class="hidden">
                <div class="form-group">
                  <label> ¿Es residente de la República Dominicana? </label>

                  <div class="radio-group">
                    <label class="radio">
                      <input
                        value="Si"
                        type="radio"
                        name="residenteRD"
                        data-field="residenteRD"
                      />

                      <span>Sí</span>
                    </label>

                    <label class="radio">
                      <input
                        value="No"
                        type="radio"
                        name="residenteRD"
                        data-field="residenteRD"
                      />

                      <span>No</span>
                    </label>
                  </div>
                </div>
              </div>
            </div>
            <div class="grid-2">
              <div class="form-group">
                <label>Profesión</label>

                <select
                  id="profesion"
                  data-field="profesion"
                  data-target="divOtraProfesion"
                  data-show-value="Otro"
                >
                  <option value="" disabled selected>Seleccione...</option>
                  <option value="Médico/a">Médico/a</option>
                  <option value="Abogado/a">Abogado/a</option>
                  <option value="Ingeniero/a">Ingeniero/a</option>
                  <option value="Arquitecto/a">Arquitecto/a</option>
                  <option value="Contador/a">Contador/a</option>
                  <option value="Economista">Economista</option>
                  <option value="Administrador/a de Empresas">
                    Administrador/a de Empresas
                  </option>
                  <option value="Mercadólogo/a">Mercadólogo/a</option>
                  <option value="Psicólogo/a">Psicólogo/a</option>
                  <option value="Profesor/a">Profesor/a</option>
                  <option value="Artista / Diseñador/a">
                    Artista / Diseñador/a
                  </option>
                  <option value="Informático / Programador">
                    Informático / Programador
                  </option>
                  <option value="Técnico / Electricista">
                    Técnico / Electricista
                  </option>
                  <option value="Chofer">Chofer</option>
                  <option value="Estudiante">Estudiante</option>
                  <option value="Ama de casa">Ama de casa</option>
                  <option value="Jubilado / Pensionado">
                    Jubilado / Pensionado
                  </option>
                  <option value="Desempleado">Desempleado</option>
                  <option value="Otro">Otro (especificar)</option>
                </select>
                <div id="divOtraProfesion" class="dependent-field hidden">
                  <div class="form-group">
                    <label for="otraProfesion">Especifique su profesión</label>

                    <input
                      type="text"
                      id="otraProfesion"
                      data-field="otraProfesion"
                      placeholder="Indique su profesión"
                    />
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label>Ocupación</label>

                <div class="radio-group">
                  <label class="radio">
                    <input
                      type="radio"
                      name="ocupacion"
                      value="Empleado"
                      data-field="ocupacion"
                    />

                    <span>Empleado</span>
                  </label>

                  <label class="radio">
                    <input
                      type="radio"
                      name="ocupacion"
                      value="Independiente"
                      data-field="ocupacion"
                    />

                    <span>Independiente</span>
                  </label>

                  <label class="radio">
                    <input
                      type="radio"
                      name="ocupacion"
                      value="Retirado"
                      data-field="ocupacion"
                    />

                    <span>Retirado</span>
                  </label>

                  <label class="radio">
                    <input
                      type="radio"
                      name="ocupacion"
                      value="Pensionado"
                      data-field="ocupacion"
                    />

                    <span>Pensionado</span>
                  </label>

                  <label class="radio">
                    <input
                      type="radio"
                      name="ocupacion"
                      value="Otro"
                      data-field="ocupacion"
                    />

                    <span>Otro</span>
                  </label>
                </div>
              </div>
            </div>

            <!-- ========================================= -->
            <div class="grid-2">
              <div class="form-group">
                <label> ¿Tienes otras fuentes de ingresos formales? </label>

                <div class="radio-group">
                  <label class="radio">
                    <input
                      value="Si"
                      type="radio"
                      name="ingresosFormales"
                      data-field="ingresosFormales"
                      data-target="divIngresosFormales"
                      data-show-value="Si"
                    />

                    <span>Sí</span>
                  </label>

                  <label class="radio">
                    <input
                      value="No"
                      type="radio"
                      name="ingresosFormales"
                      data-field="ingresosFormales"
                      data-target="divIngresosFormales"
                      data-show-value="Si"
                    />

                    <span>No</span>
                  </label>
                </div>
                <div id="divIngresosFormales" class="dependent-field hidden">
                  <div class="form-group">
                    <input
                      type="text"
                      data-field="otrosIngresosFormales"
                      placeholder="Favor indicar cuales"
                    />
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label>
                  ¿Es sujeto obligado de la Ley 155-17 sobre Lavado de activos?
                </label>

                <div class="radio-group">
                  <label class="radio">
                    <input
                      value="Si"
                      type="radio"
                      name="ley"
                      data-field="ley155"
                    />

                    <span>Sí</span>
                  </label>

                  <label class="radio">
                    <input
                      value="No"
                      type="radio"
                      name="ley"
                      data-field="ley155"
                    />

                    <span>No</span>
                  </label>
                </div>
              </div>
            </div>
            <div class="grid-1">
              <div class="form-group">
                <label>
                  ¿Es corredor de valores, ha ocupado posiciones de dirección en
                  las áreas de negocios o ha sido miembro del Consejo de una
                  entidad financiera, de valores u otro sujeto obligado, por un
                  periodo mayor o igual a 2 años?
                </label>

                <div class="radio-group">
                  <label class="radio">
                    <input
                      value="Si"
                      type="radio"
                      name="actLaboralFinanciera"
                      data-field="actLaboralFinanciera"
                      data-target="divActLaboralFinanciera"
                      data-show-value="Si"
                    />

                    <span>Sí</span>
                  </label>

                  <label class="radio">
                    <input
                      value="No"
                      type="radio"
                      name="actLaboralFinanciera"
                      data-field="actLaboralFinanciera"
                      data-target="divActLaboralFinanciera"
                      data-show-value="Si"
                    />

                    <span>No</span>
                  </label>
                </div>
                <div
                  id="divActLaboralFinanciera"
                  class="dependent-field hidden"
                >
                  <div class="form-group">
                    <input
                      type="text"
                      data-field="explicacionActLaboralFinanciera"
                      placeholder="Favor indicar escenario que aplique"
                    />
                  </div>
                </div>
              </div>
            </div>

            <!-- --------------------------------------- -->
            <!-- DATOS CONYUGE -->
            <!-- --------------------------------------- -->

            <div id="divDatosConyuge" class="hidden">
              <div class="section-divider"></div>
              <h2>Datos Cónyuge</h2>

              <div class="grid-2">
                <div class="form-group">
                  <label>Nombres</label>

                  <input
                    id="                    data-field="nombresConyuge"
"
                    type="text"
                    placeholder="Ingrese los nombres"
                    data-field="nombresConyuge"
                  />
                </div>

                <div class="form-group">
                  <label>Apellidos</label>

                  <input
                    id="apellidosConyuge"
                    type="text"
                    placeholder="Ingrese los apellidos"
                    data-field="apellidosConyuge"
                  />
                </div>
              </div>

              <div class="grid-2">
                <div class="form-group">
                  <label>Email</label>

                  <input id="emailConyuge" type="email" data-field="emailConyuge" />
                </div>

                <div class="form-group">
                  <label>Edad</label>

                  <input id="edadConyuge" type="number" data-field="edadConyuge" />
                </div>
              </div>

              <div class="grid-2">
                <div class="form-group">
                  <label>Tipo de identificación</label>

                  <div class="radio-group">
                    <label class="radio">
                      <input
                        value="Cédula"
                        type="radio"
                        name="tipoDocumentoConyuge"
                        data-field="tipoDocumentoConyuge"
                      />
                      <span>Cédula</span>
                    </label>

                    <label class="radio">
                      <input
                        value="Pasaporte"
                        type="radio"
                        name="tipoDocumentoConyuge"
                        data-field="tipoDocumentoConyuge"
                      />
                      <span>Pasaporte</span>
                    </label>
                  </div>
                </div>

                <div class="form-group">
                  <label>Número de identificación</label>

                  <input
                    id="identificacionConyuge"
                    type="text"
                    placeholder="000-0000000-0"
                    data-field="identificacionConyuge"
                    data-mask="identificacionConyuge"
                    disabled
                  />
                </div>
              </div>
              <div class="grid-2">
                <div class="form-group">
                  <label>Institución donde labora</label>

                  <input
                    id="laboraConyuge"
                    type="text"
                    data-field="laboraConyuge"
                    placeholder="Ingrese la institución"
                  />
                </div>
                <div class="form-group">
                  <label>Cargo</label>

                  <input
                    id="cargoConyuge"
                    type="text"
                    data-field="cargoConyuge"
                    placeholder="Ingrese el cargo"
                  />
                </div>
              </div>
              <div class="grid-3">
                <div class="form-group">
                  <label>Teléfono de Casa</label>

                  <input
                    id="telefonoCasaConyuge"
                    type="text"
                    class="telefonoMascara"
                    placeholder="809-000-0000"
                    data-field="telefonoCasaConyuge"
                  />
                </div>

                <div class="form-group">
                  <label>Celular</label>

                  <input
                    id="celularConyuge"
                    type="text"
                    class="telefonoMascara"
                    placeholder="809-000-0000"
                    data-field="celularConyuge"
                  />
                </div>

                <div class="form-group">
                  <label>Ingresos mensuales</label>

                  <input
                    id="ingresosConyuge"
                    type="number"
                    data-field="ingresosConyuge"
                  />
                </div>
              </div>
            </div>

            <!-- ========================================= -->
            <!-- BOTONES -->
            <!-- ========================================= -->

            <div class="button-group">
              <button type="button" class="btn-secondary" id="btnAnterior">
                ← Anterior
              </button>

              <button type="button" class="btn-primary" id="btnSiguiente">
                Siguiente →
              </button>
            </div>
          </section>
        </form>
      </div>
    </div>
  </body>

  <script src="app/paises.js"></script>
  <script src="app/municipios.js"></script>
  <script src="app/sectores.js"></script>
  <script src="app/app.js"></script>
</html>
