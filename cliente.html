<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Registro de Clientes</title>
    <link rel="shortcut icon" href="/assets/favicon.png" type="image/png">

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body data-step="0">
    <div class="background">
      <div class="container">
        <div class="header">
          <h1>Registro de Clientes</h1>

          <p>Complete la siguiente información.</p>
        </div>

        <form id="formRegistro" data-seccion="datosCliente">
          <!-- ========================================= -->

          <section class="card">
            <h2>Datos del Cliente</h2>

            <div class="grid-2">
              <div class="form-group">
                <label>Nombres</label>

                <input
                  id="nombres"
                  type="text"
                  placeholder="Ingrese los nombres"
                  data-field="nombres"
                />
              </div>

              <div class="form-group">
                <label>Apellidos</label>

                <input
                  id="apellidos"
                  type="text"
                  placeholder="Ingrese los apellidos"
                  data-field="apellidos"
                />
              </div>
            </div>

            <!-- ========================================= -->

            <div class="grid-2">
              <div class="form-group">
                <label>Tipo de identificación</label>

                <div class="radio-group">
                  <label class="radio">
                    <input
                      value="cedula"
                      type="radio"
                      name="tipo"
                      data-field="tipoDocumento"
                    />
                    <span>Cédula</span>
                  </label>

                  <label class="radio">
                    <input
                      value="pasaporte"
                      type="radio"
                      name="tipo"
                      data-field="tipoDocumento"
                    />
                    <span>Pasaporte</span>
                  </label>
                </div>
              </div>

              <div class="form-group">
                <label>Número de identificación</label>

                <input
                  id="identificacion"
                  type="text"
                  placeholder="000-0000000-0"
                  data-field="identificacion"
                />
              </div>
            </div>

            <!-- ========================================= -->

            <div class="grid-2">
              <div class="form-group">
                <label>Teléfono de Casa</label>

                <input
                  id="telefonoCasa"
                  type="text"
                  data-field="telefonoCasa"
                />
              </div>

              <div class="form-group">
                <label>Celular</label>

                <input id="celular" type="text" data-field="celular" />
              </div>
            </div>

            <!-- ========================================= -->

            <div class="grid-1">
              <div class="form-group">
                <label>Calle - Edificio - Número - Interior</label>

                <input id="direccion" type="text" data-field="direccion" />
              </div>
            </div>

            <!-- ========================================= -->

            <div class="grid-2">
              <div class="form-group">
                <label>Lugar de Nacimiento</label>

                <select id="nacimiento" data-field="nacimiento" data-paises>
                  <option value="">Seleccione...</option>
                </select>
              </div>

              <div class="form-group">
                <label>Nacionalidad</label>

                <input
                  id="nacionalidad"
                  type="text"
                  data-field="nacionalidad"
                />
              </div>
            </div>

            <!-- ========================================= -->

            <div class="grid-3">
              <div class="form-group">
                <label>Sector</label>

                <select id="sector" data-field="sector">
                  <option>Seleccione...</option>
                  <option value="pruebasector">Prueba</option>
                </select>
              </div>

              <div class="form-group">
                <label>Ciudad</label>

                <select id="ciudad" data-field="ciudad">
                  <option>Seleccione...</option>
                  <option value="pruebaciudad">Prueba</option>
                </select>
              </div>

              <div class="form-group">
                <label>País</label>

                <select id="pais" data-field="pais" data-paises>
                  <option value="">Seleccione...</option>
                </select>
              </div>
            </div>

            <!-- ========================================= -->

            <div class="grid-2">
              <div class="form-group">
                <label>Email Personal</label>

                <input id="email" type="email" data-field="email" />
              </div>

              <div class="form-group">
                <label>
                  ¿Es sujeto obligado de la Ley 155-17 sobre Lavado de activos?
                </label>

                <div class="radio-group">
                  <label class="radio">
                    <input
                      value="Si"
                      type="radio"
                      name="ley"
                      data-field="ley155"
                    />

                    <span>Sí</span>
                  </label>

                  <label class="radio">
                    <input
                      value="No"
                      type="radio"
                      name="ley"
                      data-field="ley155"
                    />

                    <span>No</span>
                  </label>
                </div>
              </div>
            </div>

            <!-- ========================================= -->

            <div class="grid-3">
              <div class="form-group">
                <label>Estado Civil</label>

                <select id="civil" data-field="civil">
                  <option>Seleccione...</option>

                  <option>Soltero</option>

                  <option>Casado</option>

                  <option>Divorciado</option>

                  <option>Viudo</option>
                </select>
              </div>

              <div class="form-group">
                <label>Sexo</label>

                <div class="radio-group">
                  <label class="radio">
                    <input
                      type="radio"
                      name="sexo"
                      value="Masculino"
                      data-field="sexo"
                    />

                    <span>Masculino</span>
                  </label>

                  <label class="radio">
                    <input
                      type="radio"
                      name="sexo"
                      value="Femenino"
                      data-field="sexo"
                    />

                    <span>Femenino</span>
                  </label>
                </div>
              </div>

              <div class="form-group">
                <label>Profesión</label>

                <input id="profesion" type="text" data-field="profesion" />
              </div>
            </div>

            <!-- ========================================= -->

            <div class="form-group">
              <label>Ocupación</label>

              <div class="radio-group">
                <label class="radio">
                  <input
                    type="radio"
                    name="ocupacion"
                    value="empleado"
                    data-field="ocupacion"
                  />

                  <span>Empleado</span>
                </label>

                <label class="radio">
                  <input
                    type="radio"
                    name="ocupacion"
                    value="independiente"
                    data-field="ocupacion"
                  />

                  <span>Independiente</span>
                </label>

                <label class="radio">
                  <input
                    type="radio"
                    name="ocupacion"
                    value="empresario"
                    data-field="ocupacion"
                  />

                  <span>Empresario</span>
                </label>

                <label class="radio">
                  <input
                    type="radio"
                    name="ocupacion"
                    value="otro"
                    data-field="ocupacion"
                  />

                  <span>Otro</span>
                </label>
              </div>
            </div>

            <!-- ========================================= -->

            <div class="button-group">
              <button type="button" class="btn-secondary" id="btnAnterior">
                ← Anterior
              </button>

              <button type="button" class="btn-primary" id="btnSiguiente">
                Siguiente →
              </button>
            </div>
          </section>
        </form>
      </div>
    </div>
    <!--=====================================
    MODAL SALIR
    ======================================-->

    <div class="modal-overlay" id="modalSalir">
      <div class="modal">
        <div class="modal-icon">⚠️</div>

        <h2>¿Desea salir del formulario?</h2>

        <p>
          Si sale ahora, toda la información ingresada se guardará y podrá continuar cuando desee.
        </p>

        <div class="modal-buttons">
          <button class="btn-secondary" id="btnVolver">Volver</button>

          <button class="btn-danger" id="btnSalir">Salir</button>
        </div>
      </div>
    </div>
  </body>

  <script src="app/app.js"></script>
</html>
