<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Información de la Inversión</title>
    <link rel="shortcut icon" href="/assets/favicon.png" type="image/png" />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body data-step="5">
    <div class="background">
      <div class="container">
        <div class="header">
          <h1>Registro de Clientes</h1>

          <p>Complete la siguiente información.</p>
        </div>
        <div class="progress-wrapper">
          <div class="progress-header">
            <span class="progress-step"> Paso 0 de 10 </span>

            <span class="progress-percent"> 0% </span>
          </div>

          <div class="progress-bar">
            <div class="progress-fill" style="width: 0%"></div>
          </div>
        </div>

        <form id="formRegistro" data-seccion="datosAdicionales">
          <section class="card">
            <h2>Información Complementaria</h2>

            <!-- Propósito -->
            <label for="propositoRelacion"> Producto(s) solicitado(s) </label>

            <!-- BANCO -->
            <div class="grid-1">
              <div class="producto-card">
                <h4>Banco</h4>

                <div class="checkbox-options">
                  <label class="checkbox-option">
                    <input
                      type="checkbox"
                      value="Cuenta de ahorros Bonus Saver"
                      data-field="productosSolicitados"
                    />
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-title">
                      Cuenta de ahorros Bonus Saver</span
                    >
                  </label>
                  <label class="checkbox-option">
                    <input
                      type="checkbox"
                      value="Cuenta corriente EzAccess"
                      data-field="productosSolicitados"
                    />
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-title"
                      >Cuenta corriente EzAccess</span
                    >
                  </label>
                  <label class="checkbox-option">
                    <input
                      type="checkbox"
                      value="Certificado de depósito"
                      data-field="productosSolicitados"
                    />
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-title"> Certificado de depósito</span>
                  </label>
                  <label class="checkbox-option">
                    <input
                      type="checkbox"
                      value="Cuenta Nómina"
                      data-field="productosSolicitados"
                    />
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-title"> Cuenta Nómina </span>
                  </label>
                  <label class="checkbox-option">
                    <input
                      type="checkbox"
                      value="Préstamo personal"
                      data-field="productosSolicitados"
                    />
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-title"> Préstamo personal </span>
                  </label>
                  <label class="checkbox-option">
                    <input
                      type="checkbox"
                      value="Préstamo de vehículo"
                      data-field="productosSolicitados"
                    />
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-title"> Préstamo de vehículo </span>
                  </label>
                  <label class="checkbox-option">
                    <input
                      type="checkbox"
                      value="Préstamo hipotecario"
                      data-field="productosSolicitados"
                    />
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-title"> Préstamo hipotecario </span>
                  </label>
                  <label class="checkbox-option">
                    <input
                      type="checkbox"
                      value="Préstamo nómina"
                      data-field="productosSolicitados"
                    />
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-title"> Préstamo nómina </span>
                  </label>
                  <label class="checkbox-option">
                    <input
                      type="checkbox"
                      value="Préstamo consolidación de deudas"
                      data-field="productosSolicitados"
                    />
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-title">
                      Préstamo consolidación de deudas
                    </span>
                  </label>
                </div>
              </div>
            </div>

            <!-- PUESTO -->
            <div class="productos-grid">
              <div class="producto-card">
                <h4>Puesto</h4>

                <div class="checkbox-options">
                  <label class="checkbox-option">
                    <input
                      type="checkbox"
                      value="Sure Investor"
                      data-field="productosSolicitados"
                    />
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-title"> Sure Investor</span>
                  </label>
                  <label class="checkbox-option">
                    <input
                      type="checkbox"
                      value="Intermediación de títulos valor"
                      data-field="productosSolicitados"
                    />
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-title">
                      Intermediación de títulos valor
                    </span>
                  </label>
                  <label class="checkbox-option">
                    <input
                      type="checkbox"
                      value="Super Investor"
                      data-field="productosSolicitados"
                    />
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-title"> Super Investor </span>
                  </label>
                </div>
              </div>

              <!-- FONDOS -->

              <div class="producto-card">
                <h4>SAFI</h4>

                <div class="checkbox-options">
                  <label class="checkbox-option">
                    <input
                      type="checkbox"
                      value="Fondo mutuo de mercado de dinero"
                      data-field="productosSolicitados"
                    />
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-title">
                      Fondo mutuo de mercado de dinero
                    </span>
                  </label>
                  <label class="checkbox-option">
                    <input
                      type="checkbox"
                      value="Fondo mutuo de mercado de dinero en dólares"
                      data-field="productosSolicitados"
                    />
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-title">
                      Fondo mutuo de mercado de dinero en dólares
                    </span>
                  </label>
                  <label class="checkbox-option">
                    <input
                      type="checkbox"
                      value="Fondo de inversión cerrado inmobiliario II"
                      data-field="productosSolicitados"
                    />
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-title">
                      Fondo de inversión cerrado inmobiliario II
                    </span>
                  </label>
                </div>
              </div>
            </div>

            <!-- Aqui tenemos los apartados de cada uno de los productos -->

            <!-- ========================================= -->
            <!-- INVERSIONES PUESTO -->
            <!-- ========================================= -->

            <div id="divInversionesPuesto" class="producto-card grid-1 hidden">
              <h4>Inversiones en Puesto</h4>
              <div class="grid-2">
                <div class="form-group">
                  <label for="montoEstimadoInversionPuestoUSD">
                    Monto estimado inversion puesto en USD
                  </label>

                  <input
                    type="number"
                    id="montoEstimadoInversionPuestoUSD"
                    data-field="montoEstimadoInversionPuestoUSD"
                    placeholder="Indique el monto..."
                  />
                  <small class="exchange-rate">
                    Tasa de cambio referencial: <strong>1 USD = 61 RD$</strong>
                  </small>
                </div>

                <div class="form-group">
                  <label for="origenFondosUSD"> Origen de fondos en USD </label>

                  <select id="origenFondosUSD" data-field="origenFondosUSD">
                    <option value="" disabled selected>Seleccione...</option>
                    <option value="Salario/Ingresos">Salario / Ingresos</option>
                    <option value="Ahorro">Ahorro</option>
                    <option value="Fondos/Prestamos tomados">
                      Fondos / Préstamos tomados
                    </option>
                    <option value="Regalo">Regalo</option>
                    <option value="Pension/Asistencia social">
                      Pensión / Asistencia social
                    </option>
                    <option value="Herencia">Herencia</option>
                    <option value="Donaciones beneficas">
                      Donaciones benéficas
                    </option>
                  </select>
                </div>
              </div>
              <div class="grid-2">
                <div class="form-group">
                  <label for="montoEstimadoInversionPuestoRD">
                    Monto estimado inversion puesto en RD$
                  </label>

                  <input
                    type="number"
                    id="montoEstimadoInversionPuestoRD"
                    data-field="montoEstimadoInversionPuestoRD"
                    placeholder="Indique el monto..."
                  />
                </div>

                <div class="form-group">
                  <label for="origenFondosPuestoRD">
                    Origen de fondos en RD$
                  </label>

                  <select
                    id="origenFondosPuestoRD"
                    data-field="origenFondosPuestoRD"
                  >
                    <option value="" disabled selected>Seleccione...</option>
                    <option value="Salario/Ingresos">Salario / Ingresos</option>
                    <option value="Ahorro">Ahorro</option>
                    <option value="Fondos/Prestamos tomados">
                      Fondos / Préstamos tomados
                    </option>
                    <option value="Regalo">Regalo</option>
                    <option value="Pension/Asistencia social">
                      Pensión / Asistencia social
                    </option>
                    <option value="Herencia">Herencia</option>
                    <option value="Donaciones beneficas">
                      Donaciones benéficas
                    </option>
                  </select>
                </div>
              </div>
            </div>

            <!-- ========================================= -->
            <!-- INVERSIONES SAFI -->
            <!-- ========================================= -->

            <div id="divInversionesSafi" class="producto-card grid-1 hidden">
              <h4>Inversiones en SAFI</h4>
              <div class="grid-2">
                <div class="form-group">
                  <label for="montoEstimadoInversionSafiUSD">
                    Monto estimado inversion puesto en USD
                  </label>

                  <input
                    type="number"
                    id="montoEstimadoInversionSafiUSD"
                    data-field="montoEstimadoInversionSafiUSD"
                    placeholder="Indique el monto..."
                  />
                  <small class="exchange-rate">
                    Tasa de cambio referencial: <strong>1 USD = 61 RD$</strong>
                  </small>
                </div>

                <div class="form-group">
                  <label for="origenFondosSafiUSD">
                    Origen de fondos en USD
                  </label>

                  <select
                    id="origenFondosSafiUSD"
                    data-field="origenFondosSafiUSD"
                  >
                    <option value="" disabled selected>Seleccione...</option>
                    <option value="Salario/Ingresos">Salario / Ingresos</option>
                    <option value="Ahorro">Ahorro</option>
                    <option value="Fondos/Prestamos tomados">
                      Fondos / Préstamos tomados
                    </option>
                    <option value="Regalo">Regalo</option>
                    <option value="Pension/Asistencia social">
                      Pensión / Asistencia social
                    </option>
                    <option value="Herencia">Herencia</option>
                    <option value="Donaciones beneficas">
                      Donaciones benéficas
                    </option>
                  </select>
                </div>
              </div>
              <div class="grid-2">
                <div class="form-group">
                  <label for="montoEstimadoInversionSafiRD">
                    Monto estimado inversion puesto en RD$
                  </label>

                  <input
                    type="number"
                    id="montoEstimadoInversionSafiRD"
                    data-field="montoEstimadoInversionSafiRD"
                    placeholder="Indique el monto..."
                  />
                </div>

                <div class="form-group">
                  <label for="origenFondosSafiRD">
                    Origen de fondos en RD$
                  </label>

                  <select
                    id="origenFondosSafiRD"
                    data-field="origenFondosSafiRD"
                  >
                    <option value="" disabled selected>Seleccione...</option>
                    <option value="Salario/Ingresos">Salario / Ingresos</option>
                    <option value="Ahorro">Ahorro</option>
                    <option value="Fondos/Prestamos tomados">
                      Fondos / Préstamos tomados
                    </option>
                    <option value="Regalo">Regalo</option>
                    <option value="Pension/Asistencia social">
                      Pensión / Asistencia social
                    </option>
                    <option value="Herencia">Herencia</option>
                    <option value="Donaciones beneficas">
                      Donaciones benéficas
                    </option>
                  </select>
                </div>
              </div>
            </div>

            <!-- ========================================= -->
            <!-- SOLICITUD BANCO -->
            <!-- ========================================= -->

            <div id="divSolicitud" class="producto-card grid-1 hidden">
              <h4>Solicitud en banco</h4>
              <div class="grid-3">
                <div class="form-group hidden" id="divSolicitudBanco">
                  <label> Cuenta en: </label>

                  <div class="radio-group">
                    <label class="radio">
                      <input
                        type="radio"
                        name="cuentaBancoMoneda"
                        value="$RD"
                        data-field="cuentaBancoMoneda"
                      />

                      <span>RD$</span>
                    </label>

                    <label class="radio">
                      <input
                        type="radio"
                        name="cuentaBancoMoneda"
                        value="USD"
                        data-field="cuentaBancoMoneda"
                      />

                      <span>USD</span>
                    </label>
                  </div>
                </div>
                <div class="form-group hidden" id="divSolicitudPrestamo">
                  <label for="montoPrestamo"> Monto a solicitar (Préstamo)</label>

                  <input
                    type="number"
                    id="montoPrestamo"
                    data-field="montoPrestamo"
                    placeholder="Indique el monto..."
                  />
                </div>
                <div class="form-group hidden" id="divSolicitudCertificado">
                  <label for="montoCertificado"> Monto estimado (Certificado)</label>

                  <input
                    type="number"
                    id="montoCertificado"
                    data-field="montoCertificado"
                    placeholder="Indique el monto..."
                  />
                </div>
              </div>
            </div>

            <!-- Aqui tenemos los campos extra si selecciona prestamos -->

            <div class="grid-1">
              <div id="divBeneficiarioPrestamo" class="grid-1 hidden">
                <div class="form-group">
                  <label for="beneficiariosTransaccion">
                    Beneficiarios Directos e Indirectos de la Transacción
                    diferentes a usted
                  </label>

                  <input
                    type="text"
                    id="beneficiariosTransaccion"
                    data-field="beneficiariosTransaccion"
                    placeholder="Indique los beneficiarios del préstamo"
                  />
                </div>
                <!-- ========================================= -->
                <!-- BENEFICIARIO FINAL -->
                <!-- ========================================= -->

                <div class="form-group">
                  <label for="identificacionBeneficiarioFinal">
                    Identificación de beneficiario final de la operación (si
                    aplica)
                  </label>

                  <input
                    type="text"
                    id="identificacionBeneficiarioFinal"
                    data-field="identificacionBeneficiarioFinal"
                    placeholder="Indique la identificación"
                  />
                </div>
              </div>
            </div>

            <!-- ========================================= -->
            <!-- CUENTA DE AHORRO BÁSICA -->
            <!-- ========================================= -->
            <div class="grid-2">
              <div class="form-group">
                <label> ¿Es una cuenta de Ahorro Básica? </label>

                <div class="radio-group">
                  <label class="radio">
                    <input
                      type="radio"
                      name="cuentaAhorroBasica"
                      value="Si"
                      data-field="cuentaAhorroBasica"
                    />

                    <span>Sí</span>
                  </label>

                  <label class="radio">
                    <input
                      type="radio"
                      name="cuentaAhorroBasica"
                      value="No"
                      data-field="cuentaAhorroBasica"
                    />

                    <span>No</span>
                  </label>
                </div>
              </div>

              <!-- ========================================= -->
              <!-- UNICA CUENTA ? -->
              <!-- ========================================= -->

              <div class="form-group">
                <label> ¿Fue verificado que solo mantiene esta cuenta? </label>

                <div class="radio-group">
                  <label class="radio">
                    <input
                      type="radio"
                      name="unicaCuenta"
                      value="Si"
                      data-field="unicaCuenta"
                    />

                    <span>Sí</span>
                  </label>

                  <label class="radio">
                    <input
                      type="radio"
                      name="unicaCuenta"
                      value="No"
                      data-field="unicaCuenta"
                    />

                    <span>No</span>
                  </label>
                </div>
              </div>
            </div>

            <!-- ========================================= -->
            <!-- CANTIDAD DE OPERACIONES -->
            <!-- ========================================= -->

            <div class="form-group">
              <label> Cantidad de Operaciones esperadas </label>

              <div class="radio-group">
                <label class="radio">
                  <input
                    type="radio"
                    name="cantidadOperaciones"
                    value="De 0 a 5"
                    data-field="cantidadOperaciones"
                    data-target="divOtraCantidadOperaciones"
                    data-show-value="Otro"
                  />

                  <span> De 0 a 5 </span>
                </label>

                <label class="radio">
                  <input
                    type="radio"
                    name="cantidadOperaciones"
                    value="De 5 a 10"
                    data-field="cantidadOperaciones"
                    data-target="divOtraCantidadOperaciones"
                    data-show-value="Otro"
                  />

                  <span> De 5 a 10 </span>
                </label>

                <label class="radio">
                  <input
                    type="radio"
                    name="cantidadOperaciones"
                    value="Más de 10"
                    data-field="cantidadOperaciones"
                    data-target="divOtraCantidadOperaciones"
                    data-show-value="Otro"
                  />

                  <span> Más de 10 </span>
                </label>

                <label class="radio">
                  <input
                    type="radio"
                    name="cantidadOperaciones"
                    value="Otro"
                    data-field="cantidadOperaciones"
                    data-target="divOtraCantidadOperaciones"
                    data-show-value="Otro"
                  />

                  <span> Otro </span>
                </label>
              </div>
            </div>

            <!-- Otro -->
            <div class="form-group">
              <div id="divOtraCantidadOperaciones" class="hidden">
                <div class="form-group">
                  <input
                    type="text"
                    id="otraCantidadOperaciones"
                    data-field="otraCantidadOperaciones"
                    placeholder="Indique la cantidad"
                  />
                </div>
              </div>
            </div>

            <!-- ========================================= -->
            <!-- FORMA DE LAS TRANSACCIONES -->
            <!-- ========================================= -->
            <div class="grid-2">
              <div class="form-group">
                <label> Forma de las transacciones </label>

                <div class="radio-group">
                  <label class="radio">
                    <input
                      type="radio"
                      name="formaTransacciones"
                      value="Efectivo"
                      data-field="formaTransacciones"
                      data-target="divTipoTransferencia"
                      data-show-value="Transferencias"
                    />

                    <span> Efectivo </span>
                  </label>

                  <label class="radio">
                    <input
                      type="radio"
                      name="formaTransacciones"
                      value="Cheque"
                      data-field="formaTransacciones"
                      data-target="divTipoTransferencia"
                      data-show-value="Transferencias"
                    />

                    <span> Cheque </span>
                  </label>

                  <label class="radio">
                    <input
                      type="radio"
                      name="formaTransacciones"
                      value="Transferencias"
                      data-field="formaTransacciones"
                      data-target="divTipoTransferencia"
                      data-show-value="Transferencias"
                    />

                    <span> Transferencias </span>
                  </label>
                </div>
              </div>

              <!-- ========================================= -->
              <!-- TIPO DE TRANSFERENCIA -->
              <!-- ========================================= -->
              <div id="divTipoTransferencia" class="hidden">
                <div class="form-group">
                  <label> Tipo de transferencia </label>

                  <div class="radio-group">
                    <label class="radio">
                      <input
                        type="radio"
                        name="tipoTransferencia"
                        value="Nacional"
                        data-field="tipoTransferencia"
                      />

                      <span> Nacional </span>
                    </label>

                    <label class="radio">
                      <input
                        type="radio"
                        name="tipoTransferencia"
                        value="Internacional"
                        data-field="tipoTransferencia"
                      />

                      <span> Internacional </span>
                    </label>
                  </div>
                </div>
              </div>
            </div>

            <!-- ========================================= -->
            <!-- PERSONAS RELACIONADAS -->
            <!-- ========================================= -->

            <div class="form-group">
              <label for="personasRelacionadas">
                Declaración de Personas Relacionadas
              </label>

              <input
                type="text"
                id="personasRelacionadas"
                data-field="personasRelacionadas"
                placeholder="Indique las personas relacionadas"
              />
            </div>

            <!-- ========================================= -->
            <!-- VINCULADO A JMMB -->
            <!-- ========================================= -->

            <div class="form-group">
              <label for="vinculadoJMMB"> ¿Es Vinculado a JMMB? </label>

              <input
                type="text"
                id="vinculadoJMMB"
                data-field="vinculadoJMMB"
                placeholder="Indique la empresa"
              />
            </div>

            <!-- ========================================= -->
            <!-- BOTONES -->
            <!-- ========================================= -->

            <div class="button-group">
              <button type="button" class="btn-secondary" id="btnAnterior">
                ← Anterior
              </button>

              <button type="button" class="btn-primary" id="btnSiguiente">
                Siguiente →
              </button>
            </div>
          </section>
        </form>
      </div>
    </div>
    <script src="app/paises.js"></script>
    <script src="app/municipios.js"></script>
    <script src="app/app.js"></script>
  </body>
</html>
