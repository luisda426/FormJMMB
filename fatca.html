<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Registro de Clientes</title>

    <link rel="shortcut icon" href="/assets/favicon.png" type="image/png" />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body data-step="3">
    <div class="background">
      <div class="container">
        <div class="header">
          <h1>Registro de Clientes</h1>

          <p>Complete la siguiente información.</p>
        </div>

        <div class="progress-wrapper">
          <div class="progress-header">
            <span class="progress-step"> Paso 0 de 10 </span>

            <span class="progress-percent"> 0% </span>
          </div>

          <div class="progress-bar">
            <div class="progress-fill" style="width: 0%"></div>
          </div>
        </div>

        <form id="formRegistro" data-seccion="datosFatca">
          <!-- ========================================= -->

          <section class="card">
            <h2>Fatca</h2>

            <p class="section-description">
              La siguiente información es requerida por regulaciones
              internacionales. Completarla nos ayuda a procesar tu solicitud
              correctamente.
            </p>

            <!-- Ciudadanía en otros países -->

            <div class="form-group">
              <label>¿Tienes nacionalidad o ciudadanía de otro país?</label>

              <div class="radio-group">
                <label class="radio">
                  <input
                    value="Si"
                    type="radio"
                    name="otrasCiudadanias"
                    data-field="otrasCiudadanias"
                    data-target="divCiudadanias"
                    data-show-value="Si"
                    required
                  />

                  <span>Sí</span>
                </label>

                <label class="radio">
                  <input
                    value="No"
                    type="radio"
                    name="otrasCiudadanias"
                    data-field="otrasCiudadanias"
                    data-target="divCiudadanias"
                    data-show-value="Si"
                    required
                  />

                  <span>No</span>
                </label>
              </div>
            </div>

            <div id="divCiudadanias" class="hidden">
              <div class="grid-2">
                <div class="form-group">
                  <label>Nacionalidad 1</label>

                  <select
                    id="ciudadania1"
                    data-field="ciudadania1"
                    data-paises-vacio
                    required
                  >
                    <option value="">Seleccione...</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Nacionalidad 2</label>

                  <select
                    id="ciudadania2"
                    data-field="ciudadania2"
                    data-paises-vacio
                  >
                    <option value="">Seleccione...</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- ============================================== -->

            <div class="form-group">
              <label>¿Es Estados Unidos su país de residencia física?</label>

              <div class="radio-group">
                <label class="radio">
                  <input
                    value="Si"
                    type="radio"
                    name="residenciaFisicaUSA"
                    data-field="residenciaFisicaUSA"
                    data-target="divTIN"
                    data-show-value="Si"
                    required
                  />

                  <span>Sí</span>
                </label>

                <label class="radio">
                  <input
                    value="No"
                    type="radio"
                    name="residenciaFisicaUSA"
                    data-field="residenciaFisicaUSA"
                    data-target="divTIN"
                    data-show-value="Si"
                    required
                  />
                  <span>No</span>
                </label>
              </div>
            </div>

            <div id="divTIN" class="hidden">
              <div class="form-group">
                <label>Número de Identificación Fiscal (TIN)</label>

                <input type="text" data-field="tin" required />
              </div>
            </div>

            <!-- ============================================== -->

            <div class="form-group">
              <label>¿Tiene más de un país de residencia fiscal?</label>

              <div class="radio-group">
                <label class="radio">
                  <input
                    value="Si"
                    type="radio"
                    name="masResidenciaFiscal"
                    data-field="masResidenciaFiscal"
                    data-target="divResidenciaFiscal"
                    data-show-value="Si"
                    required
                  />

                  <span>Sí</span>
                </label>

                <label class="radio">
                  <input
                    value="No"
                    type="radio"
                    name="masResidenciaFiscal"
                    data-field="masResidenciaFiscal"
                    data-target="divResidenciaFiscal"
                    data-show-value="Si"
                    required
                  />

                  <span>No</span>
                </label>
              </div>
            </div>

            <div id="divResidenciaFiscal" class="hidden">
              <div class="form-group">
                <label>Indique los países con residencia fiscal</label>

                <textarea
                  rows="3"
                  data-field="paisesResidenciaFiscal"
                  required
                ></textarea>
              </div>
            </div>

            <!-- ============================================== -->

            <div class="form-group">
              <label
                >Comentarios
                <small>
                  (Si se encuentra en proceso de adquirir una residencia o
                  ciudadanía en otro país, indíquelo aquí.)
                </small>
              </label>

              <textarea rows="4" data-field="comentarios"></textarea>
            </div>

            <!-- ============================================== -->

            <div class="form-group">
              <label>¿Qué condición posee en los Estados Unidos?</label>

              <div class="radio-group">
                <label class="radio">
                  <input
                    type="radio"
                    name="condicionUSA"
                    value="Ciudadania"
                    data-field="condicionUSA"
                    data-target="divResidenciaUSA"
                    data-show-value="Residencia Permanente"
                    required
                  />

                  <span>Ciudadanía</span>
                </label>

                <label class="radio">
                  <input
                    type="radio"
                    name="condicionUSA"
                    value="Residencia Permanente"
                    data-field="condicionUSA"
                    data-target="divResidenciaUSA"
                    data-show-value="Residencia Permanente"
                    required
                  />

                  <span>Residencia Permanente</span>
                </label>

                <label class="radio">
                  <input
                    type="radio"
                    name="condicionUSA"
                    value="Residencia Fiscal"
                    data-field="condicionUSA"
                    data-target="divResidenciaUSA"
                    data-show-value="Residencia Permanente"
                    required
                  />

                  <span>Residencia Fiscal</span>
                </label>

                <label class="radio">
                  <input
                    type="radio"
                    name="condicionUSA"
                    value="Ninguna"
                    data-field="condicionUSA"
                    data-target="divResidenciaUSA"
                    data-show-value="Residencia Permanente"
                    required
                  />

                  <span>Ninguna</span>
                </label>
              </div>
            </div>

            <div id="divResidenciaUSA" class="hidden">
              <div class="form-group">
                <label>Indique la residencia permanente</label>

                <input type="text" data-field="detalleResidenciaUSA" required />
              </div>
            </div>

            <!-- ============================================== -->

            <div class="grid-2">
              <div class="form-group">
                <label>¿Tiene Green Card?</label>

                <div class="radio-group">
                  <label class="radio">
                    <input
                      value="Si"
                      type="radio"
                      name="greenCard"
                      data-field="greenCard"
                      required
                    />

                    <span>Sí</span>
                  </label>

                  <label class="radio">
                    <input
                      value="No"
                      type="radio"
                      name="greenCard"
                      data-field="greenCard"
                      required
                    />

                    <span>No</span>
                  </label>
                </div>
              </div>

              <div class="form-group">
                <label>¿Tiene dirección de envío en Estados Unidos?</label>

                <div class="radio-group">
                  <label class="radio">
                    <input
                      value="Si"
                      type="radio"
                      name="direccionEnvioUSA"
                      data-field="direccionEnvioUSA"
                      data-target="divDireccionEnvio"
                      data-show-value="Si"
                      required
                    />

                    <span>Sí</span>
                  </label>

                  <label class="radio">
                    <input
                      value="No"
                      type="radio"
                      name="direccionEnvioUSA"
                      data-field="direccionEnvioUSA"
                      data-target="divDireccionEnvio"
                      data-show-value="Si"
                      required
                    />

                    <span>No</span>
                  </label>
                </div>

                <div id="divDireccionEnvio" class="dependent-field hidden">
                  <div class="form-group">
                    <label>Dirección de envío</label>

                    <input type="text" data-field="direccionEnvio" required />
                  </div>
                </div>
              </div>
            </div>

            <!-- ============================================== -->

            <div class="grid-2">
              <!-- ============================== -->
              <!-- DIRECCIÓN EN USA -->
              <!-- ============================== -->

              <div class="form-group">
                <label>¿Tiene dirección de residencia en Estados Unidos?</label>

                <div class="radio-group">
                  <label class="radio">
                    <input
                      type="radio"
                      name="direccionResidenciaUSA"
                      value="Si"
                      data-field="direccionResidenciaUSA"
                      data-target="divDireccionResidencia"
                      data-show-value="Si"
                      required
                    />
                    <span>Sí</span>
                  </label>

                  <label class="radio">
                    <input
                      type="radio"
                      name="direccionResidenciaUSA"
                      value="No"
                      data-field="direccionResidenciaUSA"
                      data-target="divDireccionResidencia"
                      data-show-value="Si"
                      required
                    />
                    <span>No</span>
                  </label>
                </div>

                <!-- Campo dependiente -->

                <div id="divDireccionResidencia" class="dependent-field hidden">
                  <div class="form-group">
                    <label>Dirección de residencia</label>

                    <input
                      type="text"
                      data-field="direccionResidencia"
                      required
                    />
                  </div>
                </div>
              </div>

              <!-- ============================== -->
              <!-- TELÉFONO EXTRANJERO -->
              <!-- ============================== -->

              <div class="form-group">
                <label>¿Tiene número telefónico fuera del país?</label>

                <div class="radio-group">
                  <label class="radio">
                    <input
                      type="radio"
                      name="telefonoExtranjero"
                      value="Si"
                      data-field="telefonoExtranjero"
                      data-target="divTelefonoExtranjero"
                      data-show-value="Si"
                      required
                    />
                    <span>Sí</span>
                  </label>

                  <label class="radio">
                    <input
                      type="radio"
                      name="telefonoExtranjero"
                      value="No"
                      data-field="telefonoExtranjero"
                      data-target="divTelefonoExtranjero"
                      data-show-value="Si"
                      required
                    />
                    <span>No</span>
                  </label>
                </div>

                <!-- Campo dependiente -->

                <div id="divTelefonoExtranjero" class="dependent-field hidden">
                  <div class="form-group">
                    <label>Número telefónico</label>

                    <input
                      type="text"
                      data-field="telefonoExtranjeroNumero"
                      class="telefonoMascara"
                      required
                    />
                  </div>
                </div>
              </div>
            </div>

            <!-- ========================================= -->

            <div class="button-group">
              <button type="button" class="btn-secondary" id="btnAnterior">
                ← Anterior
              </button>

              <button type="button" class="btn-primary" id="btnSiguiente">
                Siguiente →
              </button>
            </div>
          </section>
        </form>
      </div>
    </div>

    <!--=====================================
    MODAL CAMPOS VACIOS
    ======================================-->

    <div id="toastPremium" class="toast-premium">
      <div class="toast-icon" id="toastIcon">✓</div>

      <div class="toast-content">
        <strong id="toastTitulo">Listo</strong>
        <span id="toastMensaje">Operación completada.</span>
      </div>

      <button type="button" class="toast-close" onclick="cerrarToast()">
        ×
      </button>
    </div>

    <!--=====================================
    VIDEO DE ESPERA
    ======================================-->

    <div id="loadingOverlay">
      <video id="loadingVideo" autoplay muted playsinline loop>
        <source src="assets/loading.webm" type="video/webm" />
      </video>

      <p id="loadingText">Cargando...</p>
    </div>
  </body>

  <script src="app/paises.js"></script>
  <script src="app/municipios.js"></script>
  <script src="app/app.js"></script>
</html>
